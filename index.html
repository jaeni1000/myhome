<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>나만의 코지 스튜디오 & 마을 광장</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;800&display=swap');
    body {
      font-family: 'Pretendard', sans-serif;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    .custom-scroll::-webkit-scrollbar {
      width: 6px;
    }
    .custom-scroll::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.05);
      border-radius: 9999px;
    }
    .custom-scroll::-webkit-scrollbar-thumb {
      background: rgba(140, 120, 100, 0.3);
      border-radius: 9999px;
    }
  </style>
</head>
<body class="bg-stone-900 text-stone-100 min-h-screen flex flex-col items-center justify-center p-2 sm:p-4 overflow-hidden select-none">

  <!-- 메인 게임 컨테이너 -->
  <div class="relative w-full max-w-[960px] bg-stone-800 rounded-2xl shadow-2xl overflow-hidden border border-stone-700/60 flex flex-col">
    
    <!-- 상단 상태바 -->
    <header class="flex items-center justify-between px-4 py-3 bg-stone-850 border-b border-stone-700/50 z-10 flex-wrap gap-2">
      <div class="flex items-center gap-3">
        <span class="text-2xl" id="map-icon">🏡</span>
        <div>
          <div class="flex items-center gap-2">
            <h1 id="title-display" class="font-bold text-stone-100 text-base sm:text-lg">재헌의 코지 스튜디오</h1>
            <span id="location-badge" class="px-2 py-0.5 text-xs rounded-full bg-amber-500/20 text-amber-300 font-medium border border-amber-500/30">실내 거실</span>
          </div>
          <p id="sub-prompt" class="text-xs text-stone-400">바닥을 클릭해 원하는 곳으로 걸어가 보세요</p>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <button id="profile-edit-btn" class="px-3 py-1.5 rounded-xl bg-stone-700 hover:bg-stone-600 text-stone-200 text-xs font-medium border border-stone-600 transition flex items-center gap-1.5 shadow-sm">
          <span>👤</span> 프로필 수정
        </button>
        <button id="scene-toggle-btn" class="px-3 py-1.5 rounded-xl bg-amber-600 hover:bg-amber-500 text-white text-xs font-semibold shadow-md transition flex items-center gap-1.5">
          <span>🚪</span> 밖으로 나가기
        </button>
        <button id="music-btn" class="px-3 py-1.5 rounded-xl bg-stone-700/80 hover:bg-stone-600 text-stone-300 text-xs font-medium border border-stone-600 transition flex items-center gap-1.5">
          <span id="music-icon">🎵</span> 신스 BGM
        </button>
      </div>
    </header>

    <!-- 캔버스 영역 -->
    <div class="relative w-full aspect-[4/3] max-h-[640px] bg-stone-950 flex items-center justify-center overflow-hidden">
      <canvas id="gameCanvas" width="960" height="640" class="w-full h-full object-contain cursor-pointer"></canvas>
      
      <!-- 암전 페이드 트랜지션 오버레이 -->
      <div id="fade-overlay" class="absolute inset-0 bg-stone-950 opacity-0 pointer-events-none transition-opacity duration-300 z-20"></div>

      <!-- 플로팅 토스트 알림창 -->
      <div id="toast" class="absolute bottom-4 left-1/2 -translate-x-1/2 px-4 py-2 bg-stone-900/90 text-amber-200 text-xs sm:text-sm font-medium rounded-full border border-amber-500/40 shadow-xl backdrop-blur-md opacity-0 pointer-events-none transition-opacity duration-200 z-30 flex items-center gap-2">
        <span id="toast-icon">✨</span>
        <span id="toast-msg">메시지</span>
      </div>
    </div>

    <!-- 하단 조작 가이드 -->
    <footer class="px-4 py-2.5 bg-stone-900 border-t border-stone-800 text-[11px] sm:text-xs text-stone-400 flex items-center justify-between flex-wrap gap-2">
      <div class="flex items-center gap-3">
        <span class="flex items-center gap-1"><kbd class="px-1.5 py-0.5 rounded bg-stone-800 border border-stone-700 text-stone-300">클릭</kbd> 또는 <kbd class="px-1.5 py-0.5 rounded bg-stone-800 border border-stone-700 text-stone-300">터치</kbd> 로 이동</span>
        <span class="hidden sm:inline-flex items-center gap-1"><kbd class="px-1.5 py-0.5 rounded bg-stone-800 border border-stone-700 text-stone-300">W A S D</kbd> 방향키 조작</span>
      </div>
      <div class="flex items-center gap-2 text-stone-400">
        <span>현재 캐릭터: <strong id="avatar-desc" class="text-stone-200">재헌 (남성)</strong></span>
      </div>
    </footer>
  </div>

  <!-- 프로필 설정 / 첫 접속 온보딩 모달 -->
  <div id="profile-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-stone-850 border border-stone-700 rounded-2xl w-full max-w-md p-6 shadow-2xl text-stone-100 relative">
      <div class="text-center mb-6">
        <div class="w-16 h-16 mx-auto rounded-2xl bg-amber-500/20 border border-amber-500/30 flex items-center justify-center text-3xl mb-3 shadow-inner" id="preview-avatar-icon">
          🧑
        </div>
        <h2 class="text-xl font-bold text-stone-100">캐릭터 프로필 생성</h2>
        <p class="text-xs text-stone-400 mt-1">이름과 성별을 고르고 나만의 아지트로 입장하세요!</p>
      </div>

      <div class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-stone-300 mb-1.5">당신의 이름(닉네임)</label>
          <input type="text" id="input-name" maxlength="10" placeholder="이름을 입력하세요 (예: 재헌)" 
            class="w-full px-4 py-2.5 rounded-xl bg-stone-900 border border-stone-700 text-stone-100 placeholder-stone-500 focus:outline-none focus:border-amber-500 text-sm">
        </div>

        <div>
          <label class="block text-xs font-semibold text-stone-300 mb-1.5">캐릭터 성별 & 외형 선택</label>
          <div class="grid grid-cols-2 gap-3">
            <button type="button" id="gender-male" class="gender-btn flex flex-col items-center p-3 rounded-xl border border-stone-700 bg-stone-800/80 hover:bg-stone-750 transition active:scale-95">
              <span class="text-2xl mb-1">👦</span>
              <span class="text-sm font-bold text-stone-200">남자 아바타</span>
              <span class="text-[10px] text-stone-400 mt-0.5">단정한 숏컷 & 자켓</span>
            </button>
            <button type="button" id="gender-female" class="gender-btn flex flex-col items-center p-3 rounded-xl border border-stone-700 bg-stone-800/80 hover:bg-stone-750 transition active:scale-95">
              <span class="text-2xl mb-1">👧</span>
              <span class="text-sm font-bold text-stone-200">여자 아바타</span>
              <span class="text-[10px] text-stone-400 mt-0.5">웨이브 롱헤어 & 리본</span>
            </button>
          </div>
        </div>
      </div>

      <div class="mt-6 flex justify-end gap-2">
        <button id="cancel-profile-btn" class="px-4 py-2 rounded-xl bg-stone-750 hover:bg-stone-700 text-stone-300 text-xs font-medium transition hidden">취소</button>
        <button id="save-profile-btn" class="w-full py-2.5 rounded-xl bg-amber-600 hover:bg-amber-500 text-white font-bold text-sm shadow-lg transition">시작하기</button>
      </div>
    </div>
  </div>

  <!-- 공지 게시판 모달 (수정사항 5개 역순) -->
  <div id="board-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-stone-850 border border-stone-700 rounded-2xl w-full max-w-lg p-6 shadow-2xl text-stone-100 flex flex-col max-h-[85vh]">
      <div class="flex items-center justify-between pb-3 border-b border-stone-700/80">
        <div class="flex items-center gap-2">
          <span class="text-2xl">📋</span>
          <h2 class="text-lg font-bold">마을 광장 공지 게시판</h2>
        </div>
        <button id="close-board-btn" class="w-8 h-8 rounded-lg bg-stone-800 hover:bg-stone-700 flex items-center justify-center text-stone-400 hover:text-stone-100 transition">✕</button>
      </div>

      <!-- 게시판 탭 -->
      <div class="flex gap-2 my-3 border-b border-stone-700 pb-2">
        <button id="tab-updates" class="px-3 py-1.5 rounded-lg text-xs font-bold bg-amber-600 text-white transition">최근 수정사항 (5)</button>
        <button id="tab-events" class="px-3 py-1.5 rounded-lg text-xs font-medium bg-stone-800 text-stone-400 hover:text-stone-200 transition">이벤트</button>
        <button id="tab-news" class="px-3 py-1.5 rounded-lg text-xs font-medium bg-stone-800 text-stone-400 hover:text-stone-200 transition">광장 뉴스</button>
      </div>

      <!-- 탭 본문 영역 -->
      <div id="tab-content" class="overflow-y-auto custom-scroll pr-1 flex-1 space-y-3">
        <!-- JS로 동적 렌더링 -->
      </div>
    </div>
  </div>

  <script>
    // --- 1. 유저 프로필 & 스토리지 관리 ---
    const STORAGE_KEY = 'cozy_room_profile_v1';
    let userProfile = {
      name: '재헌',
      gender: 'male',
      isNew: true
    };

    function loadProfile() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          userProfile = { ...userProfile, ...JSON.parse(saved), isNew: false };
        }
      } catch (e) {
        console.error('스토리지 로드 실패', e);
      }
    }

    function saveProfile() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(userProfile));
      } catch (e) {
        console.error('스토리지 저장 실패', e);
      }
      updateUIHeader();
    }

    function updateUIHeader() {
      const titleEl = document.getElementById('title-display');
      const avatarDesc = document.getElementById('avatar-desc');
      const previewIcon = document.getElementById('preview-avatar-icon');
      
      const genderName = userProfile.gender === 'male' ? '남성' : '여성';
      if (titleEl) titleEl.textContent = `${userProfile.name}의 코지 스튜디오`;
      if (avatarDesc) avatarDesc.textContent = `${userProfile.name} (${genderName})`;
      if (previewIcon) previewIcon.textContent = userProfile.gender === 'male' ? '👦' : '👧';
    }

    // --- 2. 게임 맵 및 렌더링 엔진 ---
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const MAP_W = 960;
    const MAP_H = 640;

    let currentScene = 'indoor'; // 'indoor' | 'outdoor'
    let isTransitioning = false;

    // 아바타 상태
    const player = {
      x: 480,
      y: 340,
      targetX: 480,
      targetY: 340,
      speed: 4.0,
      isMoving: false,
      dir: 'down', // 'down', 'up', 'left', 'right'
      frame: 0,
      walkTimer: 0,
      clickEffect: null
    };

    // 파티클 시스템
    let particles = [];

    // 실내 가구 및 장애물 충돌 박스
    const indoorColliders = [
      { name: '작업 데스크', x: 120, y: 120, w: 200, h: 90, type: 'desk' },
      { name: '커피 바', x: 640, y: 120, w: 200, h: 90, type: 'coffee' },
      { name: '소파', x: 380, y: 240, w: 200, h: 100, type: 'sofa' },
      { name: '침대', x: 120, y: 410, w: 160, h: 140, type: 'bed' },
      { name: '턴테이블', x: 690, y: 440, w: 130, h: 90, type: 'music' }
    ];

    // 야외 가구 및 장애물
    const outdoorColliders = [
      { name: '소원 분수대', x: 420, y: 230, w: 120, h: 120, type: 'fountain' },
      { name: '공지 게시판', x: 230, y: 140, w: 110, h: 70, type: 'board' },
      { name: '정원 벤치', x: 630, y: 170, w: 130, h: 65, type: 'bench' },
      { name: '꽃 화단 정원', x: 650, y: 390, w: 170, h: 110, type: 'flowers' }
    ];

    // 출입문 트리거
    const indoorDoor = { x: 440, y: 550, w: 80, h: 50 };
    const outdoorHomeDoor = { x: 440, y: 50, w: 80, h: 50 };

    // 키보드 조작
    const keys = {};
    window.addEventListener('keydown', e => {
      keys[e.key.toLowerCase()] = true;
    });
    window.addEventListener('keyup', e => {
      keys[e.key.toLowerCase()] = false;
    });

    // --- 3. 오디오 신디사이저 (BGM) ---
    let audioCtx = null;
    let isPlayingBgm = false;
    let bgmInterval = null;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playChord() {
      if (!audioCtx || !isPlayingBgm) return;
      const chords = [
        [261.63, 329.63, 392.00, 493.88], // Cmaj7
        [220.00, 261.63, 329.63, 392.00], // Am7
        [174.61, 220.00, 261.63, 329.63], // Fmaj7
        [196.00, 246.94, 293.66, 349.23]  // G7
      ];
      const chord = chords[Math.floor(Math.random() * chords.length)];
      const now = audioCtx.currentTime;

      chord.forEach(freq => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, now);
        
        gain.gain.setValueAtTime(0.001, now);
        gain.gain.linearRampToValueAtTime(0.03, now + 0.3);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 2.5);

        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 2.6);
      });
    }

    function toggleBgm() {
      initAudio();
      isPlayingBgm = !isPlayingBgm;
      const btn = document.getElementById('music-btn');
      const icon = document.getElementById('music-icon');
      if (isPlayingBgm) {
        btn.classList.add('bg-amber-600', 'text-white');
        icon.textContent = '🔊';
        showToast('🎵 칠한 로파이 신스 BGM이 재생됩니다.');
        playChord();
        bgmInterval = setInterval(playChord, 3000);
      } else {
        btn.classList.remove('bg-amber-600', 'text-white');
        icon.textContent = '🎵';
        showToast('BGM이 정지되었습니다.');
        clearInterval(bgmInterval);
      }
    }

    // --- 4. 충돌 및 이동 처리 ---
    function checkCollision(x, y) {
      const colliders = currentScene === 'indoor' ? indoorColliders : outdoorColliders;
      const r = 16; // 캐릭터 충돌 반지름
      
      // 방 테두리 벽 충돌
      if (currentScene === 'indoor') {
        if (x < 70 || x > MAP_W - 70 || y < 90 || y > MAP_H - 70) {
          // 남쪽 문 통과는 예외
          if (!(x >= indoorDoor.x && x <= indoorDoor.x + indoorDoor.w && y > MAP_H - 85)) {
            return true;
          }
        }
      } else {
        // 야외 외곽
        if (x < 60 || x > MAP_W - 60 || y < 60 || y > MAP_H - 60) {
          // 북쪽 집 문 통과는 예외
          if (!(x >= outdoorHomeDoor.x && x <= outdoorHomeDoor.x + outdoorHomeDoor.w && y < 75)) {
            return true;
          }
        }
      }

      // 가구 박스 충돌
      for (let c of colliders) {
        const margin = 10;
        if (x > c.x - margin && x < c.x + c.w + margin &&
            y > c.y - margin && y < c.y + c.h + margin) {
          return true;
        }
      }
      return false;
    }

    function switchScene(target) {
      if (isTransitioning) return;
      isTransitioning = true;
      const overlay = document.getElementById('fade-overlay');
      overlay.style.opacity = '1';

      setTimeout(() => {
        currentScene = target;
        const iconEl = document.getElementById('map-icon');
        const badgeEl = document.getElementById('location-badge');
        const toggleBtn = document.getElementById('scene-toggle-btn');

        if (currentScene === 'outdoor') {
          player.x = 480;
          player.y = 110;
          player.targetX = 480;
          player.targetY = 110;
          player.dir = 'down';
          iconEl.textContent = '⛲';
          badgeEl.textContent = '마을 광장';
          badgeEl.className = 'px-2 py-0.5 text-xs rounded-full bg-emerald-500/20 text-emerald-300 font-medium border border-emerald-500/30';
          toggleBtn.innerHTML = '<span>🏠</span> 방으로 들어가기';
          toggleBtn.className = 'px-3 py-1.5 rounded-xl bg-stone-700 hover:bg-stone-600 text-stone-200 text-xs font-semibold shadow-md transition flex items-center gap-1.5';
          showToast('🌿 햇살 가득한 마을 광장으로 나왔습니다!');
        } else {
          player.x = 480;
          player.y = 510;
          player.targetX = 480;
          player.targetY = 510;
          player.dir = 'up';
          iconEl.textContent = '🏡';
          badgeEl.textContent = '실내 거실';
          badgeEl.className = 'px-2 py-0.5 text-xs rounded-full bg-amber-500/20 text-amber-300 font-medium border border-amber-500/30';
          toggleBtn.innerHTML = '<span>🚪</span> 밖으로 나가기';
          toggleBtn.className = 'px-3 py-1.5 rounded-xl bg-amber-600 hover:bg-amber-500 text-white text-xs font-semibold shadow-md transition flex items-center gap-1.5';
          showToast(`🏡 ${userProfile.name}의 방으로 들어왔습니다.`);
        }

        setTimeout(() => {
          overlay.style.opacity = '0';
          isTransitioning = false;
        }, 150);
      }, 300);
    }

    // --- 5. 렌더링 루프 ---
    function update() {
      // 키보드 조작 확인
      let vx = 0;
      let vy = 0;
      if (keys['w'] || keys['arrowup']) vy -= 1;
      if (keys['s'] || keys['arrowdown']) vy += 1;
      if (keys['a'] || keys['arrowleft']) vx -= 1;
      if (keys['d'] || keys['arrowright']) vx += 1;

      if (vx !== 0 || vy !== 0) {
        // 벡터 정규화
        const len = Math.hypot(vx, vy);
        const stepX = (vx / len) * player.speed;
        const stepY = (vy / len) * player.speed;

        if (!checkCollision(player.x + stepX, player.y)) player.x += stepX;
        if (!checkCollision(player.x, player.y + stepY)) player.y += stepY;

        player.targetX = player.x;
        player.targetY = player.y;
        player.isMoving = true;

        if (Math.abs(vx) > Math.abs(vy)) {
          player.dir = vx > 0 ? 'right' : 'left';
        } else {
          player.dir = vy > 0 ? 'down' : 'up';
        }
      } else {
        // 마우스 클릭 목표 지점 이동
        const dx = player.targetX - player.x;
        const dy = player.targetY - player.y;
        const dist = Math.hypot(dx, dy);

        if (dist > 4) {
          player.isMoving = true;
          const step = Math.min(player.speed, dist);
          const nextX = player.x + (dx / dist) * step;
          const nextY = player.y + (dy / dist) * step;

          // 슬라이딩 이동 지원
          let moved = false;
          if (!checkCollision(nextX, player.y)) {
            player.x = nextX;
            moved = true;
          }
          if (!checkCollision(player.x, nextY)) {
            player.y = nextY;
            moved = true;
          }

          if (!moved) {
            player.targetX = player.x;
            player.targetY = player.y;
            player.isMoving = false;
          }

          if (Math.abs(dx) > Math.abs(dy)) {
            player.dir = dx > 0 ? 'right' : 'left';
          } else {
            player.dir = dy > 0 ? 'down' : 'up';
          }
        } else {
          player.isMoving = false;
        }
      }

      // 걸음 모션 타이머
      if (player.isMoving) {
        player.walkTimer += 0.2;
      } else {
        player.walkTimer = 0;
      }

      // 맵 출입문 트리거 체크
      if (!isTransitioning) {
        if (currentScene === 'indoor' && player.y > MAP_H - 80 && Math.abs(player.x - 480) < 40) {
          switchScene('outdoor');
        } else if (currentScene === 'outdoor' && player.y < 80 && Math.abs(player.x - 480) < 40) {
          switchScene('indoor');
        }
      }

      // 파티클 업데이트
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.alpha -= p.decay;
        if (p.alpha <= 0) particles.splice(i, 1);
      }
    }

    function draw() {
      ctx.clearRect(0, 0, MAP_W, MAP_H);

      if (currentScene === 'indoor') {
        drawIndoorScene();
      } else {
        drawOutdoorScene();
      }

      // 클릭 링 이펙트
      if (player.clickEffect && player.clickEffect.alpha > 0) {
        ctx.save();
        ctx.beginPath();
        ctx.arc(player.clickEffect.x, player.clickEffect.y, player.clickEffect.radius, 0, Math.PI * 2);
        ctx.strokeStyle = `rgba(245, 158, 11, ${player.clickEffect.alpha})`;
        ctx.lineWidth = 2.5;
        ctx.stroke();
        ctx.restore();
        player.clickEffect.radius += 0.9;
        player.clickEffect.alpha -= 0.04;
      }

      // 파티클 그리기
      particles.forEach(p => {
        ctx.save();
        ctx.globalAlpha = p.alpha;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      });

      // 아바타 그리기
      drawAvatar(player.x, player.y, player.dir, player.walkTimer, userProfile.gender);

      requestAnimationFrame(() => {
        update();
        draw();
      });
    }

    // --- 6. 씬 배경 그래픽 그리기 ---
    function drawIndoorScene() {
      // 따뜻한 오크 우드 마루 바닥
      ctx.fillStyle = '#29221b';
      ctx.fillRect(0, 0, MAP_W, MAP_H);

      // 마루판 패턴 라인
      ctx.strokeStyle = '#221b15';
      ctx.lineWidth = 1;
      for (let y = 100; y < MAP_H - 60; y += 36) {
        ctx.beginPath();
        ctx.moveTo(60, y);
        ctx.lineTo(MAP_W - 60, y);
        ctx.stroke();
      }

      // 북쪽 벽면
      ctx.fillStyle = '#3a342d';
      ctx.fillRect(50, 40, MAP_W - 100, 60);

      // 벽 창문 & 햇살
      ctx.fillStyle = '#60a5fa';
      ctx.fillRect(400, 48, 160, 40);
      ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
      ctx.fillRect(402, 50, 76, 36);
      ctx.fillRect(482, 50, 76, 36);

      // 거실 러그 카펫
      ctx.fillStyle = '#3f3931';
      ctx.beginPath();
      ctx.roundRect(330, 210, 300, 160, 24);
      ctx.fill();

      // 문 발판 매트 및 표지판
      ctx.fillStyle = '#b45309';
      ctx.fillRect(indoorDoor.x, indoorDoor.y + 10, indoorDoor.w, indoorDoor.h - 10);
      ctx.fillStyle = '#fef3c7';
      ctx.font = 'bold 12px Pretendard';
      ctx.textAlign = 'center';
      ctx.fillText('OUTSIDE ➔', indoorDoor.x + 40, indoorDoor.y + 32);

      // 가구 렌더링
      indoorColliders.forEach(c => {
        ctx.save();
        ctx.fillStyle = '#1c1917';
        ctx.beginPath();
        ctx.roundRect(c.x + 4, c.y + 8, c.w, c.h, 12);
        ctx.fill();

        if (c.type === 'desk') {
          ctx.fillStyle = '#44403c';
          ctx.beginPath();
          ctx.roundRect(c.x, c.y, c.w, c.h, 10);
          ctx.fill();
          // 모니터
          ctx.fillStyle = '#38bdf8';
          ctx.fillRect(c.x + 75, c.y + 15, 50, 28);
        } else if (c.type === 'coffee') {
          ctx.fillStyle = '#573f2c';
          ctx.beginPath();
          ctx.roundRect(c.x, c.y, c.w, c.h, 10);
          ctx.fill();
          // 머신
          ctx.fillStyle = '#d97706';
          ctx.fillRect(c.x + 85, c.y + 20, 30, 25);
        } else if (c.type === 'sofa') {
          ctx.fillStyle = '#4b5563';
          ctx.beginPath();
          ctx.roundRect(c.x, c.y, c.w, c.h, 16);
          ctx.fill();
          ctx.fillStyle = '#d97706';
          ctx.fillRect(c.x + 80, c.y + 35, 40, 30);
        } else if (c.type === 'bed') {
          ctx.fillStyle = '#1e3a8a';
          ctx.beginPath();
          ctx.roundRect(c.x, c.y, c.w, c.h, 12);
          ctx.fill();
          ctx.fillStyle = '#93c5fd';
          ctx.fillRect(c.x + 10, c.y + 10, c.w - 20, 45);
        } else if (c.type === 'music') {
          ctx.fillStyle = '#3f2e20';
          ctx.beginPath();
          ctx.roundRect(c.x, c.y, c.w, c.h, 10);
          ctx.fill();
          // LP판
          ctx.fillStyle = '#18181b';
          ctx.beginPath();
          ctx.arc(c.x + 65, c.y + 45, 26, 0, Math.PI * 2);
          ctx.fill();
        }

        // 라벨 텍스트
        ctx.fillStyle = '#d6d3d1';
        ctx.font = '12px Pretendard';
        ctx.textAlign = 'center';
        ctx.fillText(c.name, c.x + c.w / 2, c.y + c.h - 10);
        ctx.restore();
      });
    }

    function drawOutdoorScene() {
      // 잔디 바닥
      ctx.fillStyle = '#223d24';
      ctx.fillRect(0, 0, MAP_W, MAP_H);

      // 자갈 보도블록 산책길
      ctx.fillStyle = '#44403c';
      ctx.fillRect(420, 60, 120, MAP_H - 120);
      ctx.fillRect(180, 270, MAP_W - 360, 100);

      // 집 입구 표시
      ctx.fillStyle = '#b45309';
      ctx.fillRect(outdoorHomeDoor.x, outdoorHomeDoor.y, outdoorHomeDoor.w, outdoorHomeDoor.h);
      ctx.fillStyle = '#fef3c7';
      ctx.font = 'bold 12px Pretendard';
      ctx.textAlign = 'center';
      ctx.fillText('HOME ➔', outdoorHomeDoor.x + 40, outdoorHomeDoor.y + 30);

      // 야외 오브젝트 렌더링
      outdoorColliders.forEach(c => {
        ctx.save();
        if (c.type === 'fountain') {
          // 분수대
          ctx.fillStyle = '#38bdf8';
          ctx.beginPath();
          ctx.arc(c.x + 60, c.y + 60, 55, 0, Math.PI * 2);
          ctx.fill();
          ctx.lineWidth = 6;
          ctx.strokeStyle = '#94a3b8';
          ctx.stroke();

          // 중앙 노즐
          ctx.fillStyle = '#f8fafc';
          ctx.beginPath();
          ctx.arc(c.x + 60, c.y + 60, 14, 0, Math.PI * 2);
          ctx.fill();
        } else if (c.type === 'board') {
          // 게시판
          ctx.fillStyle = '#78350f';
          ctx.fillRect(c.x + 10, c.y + c.h - 12, 10, 12);
          ctx.fillRect(c.x + c.w - 20, c.y + c.h - 12, 10, 12);
          ctx.fillStyle = '#d97706';
          ctx.beginPath();
          ctx.roundRect(c.x, c.y, c.w, c.h - 10, 8);
          ctx.fill();
          ctx.fillStyle = '#fef3c7';
          ctx.fillRect(c.x + 10, c.y + 8, c.w - 20, c.h - 26);
        } else if (c.type === 'bench') {
          // 벤치
          ctx.fillStyle = '#92400e';
          ctx.beginPath();
          ctx.roundRect(c.x, c.y, c.w, c.h, 6);
          ctx.fill();
        } else if (c.type === 'flowers') {
          // 화단
          ctx.fillStyle = '#166534';
          ctx.beginPath();
          ctx.roundRect(c.x, c.y, c.w, c.h, 12);
          ctx.fill();
          // 알록달록 꽃들
          const colors = ['#f43f5e', '#ec4899', '#a855f7', '#fbbf24'];
          for (let i = 0; i < 16; i++) {
            ctx.fillStyle = colors[i % colors.length];
            const fx = c.x + 20 + (i % 4) * 36;
            const fy = c.y + 20 + Math.floor(i / 4) * 22;
            ctx.beginPath();
            ctx.arc(fx, fy, 5, 0, Math.PI * 2);
            ctx.fill();
          }
        }

        ctx.fillStyle = '#f1f5f9';
        ctx.font = 'bold 12px Pretendard';
        ctx.textAlign = 'center';
        ctx.fillText(c.name, c.x + c.w / 2, c.y + c.h + 16);
        ctx.restore();
      });
    }

    // --- 7. 성별별 아바타 렌더링 ---
    function drawAvatar(x, y, dir, timer, gender) {
      ctx.save();
      const bounce = Math.sin(timer) * 3;

      // 발 밑 그림자
      ctx.fillStyle = 'rgba(0, 0, 0, 0.35)';
      ctx.beginPath();
      ctx.ellipse(x, y + 16, 14, 6, 0, 0, Math.PI * 2);
      ctx.fill();

      // 몸통 / 상의
      if (gender === 'male') {
        // 단정한 네이비 자켓
        ctx.fillStyle = '#1e3a8a';
      } else {
        // 포근한 크림 핑크 니트
        ctx.fillStyle = '#ec4899';
      }
      ctx.beginPath();
      ctx.roundRect(x - 9, y - 6 + bounce, 18, 18, 5);
      ctx.fill();

      // 하의 (팬츠 vs 스커트)
      if (gender === 'male') {
        // 차콜 슬랙스 팬츠
        ctx.fillStyle = '#334155';
        ctx.fillRect(x - 8, y + 11 + bounce, 6, 8);
        ctx.fillRect(x + 2, y + 11 + bounce, 6, 8);
      } else {
        // 플리츠 스커트 & 다리
        ctx.fillStyle = '#be185d';
        ctx.beginPath();
        ctx.roundRect(x - 9, y + 10 + bounce, 18, 8, 3);
        ctx.fill();
        ctx.fillStyle = '#fed7aa';
        ctx.fillRect(x - 6, y + 17 + bounce, 4, 4);
        ctx.fillRect(x + 2, y + 17 + bounce, 4, 4);
      }

      // 얼굴 (스킨)
      ctx.fillStyle = '#fed7aa';
      ctx.beginPath();
      ctx.arc(x, y - 14 + bounce, 10, 0, Math.PI * 2);
      ctx.fill();

      // 성별 헤어스타일
      if (gender === 'male') {
        // 단정한 숏컷 헤어
        ctx.fillStyle = '#1c1917';
        ctx.beginPath();
        ctx.arc(x, y - 17 + bounce, 11, Math.PI, Math.PI * 2);
        ctx.fill();
        ctx.fillRect(x - 10, y - 18 + bounce, 20, 6);
      } else {
        // 롱 웨이브 헤어 & 헤어핀
        ctx.fillStyle = '#451a03';
        ctx.beginPath();
        ctx.arc(x, y - 17 + bounce, 11, Math.PI, Math.PI * 2);
        ctx.fill();
        // 양 옆 롱 헤어
        ctx.fillRect(x - 11, y - 18 + bounce, 4, 22);
        ctx.fillRect(x + 7, y - 18 + bounce, 4, 22);
        // 리본 포인트
        ctx.fillStyle = '#fbbf24';
        ctx.fillRect(x + 6, y - 20 + bounce, 5, 4);
      }

      // 시선 (눈동자)
      ctx.fillStyle = '#18181b';
      if (dir === 'down') {
        ctx.fillRect(x - 4, y - 14 + bounce, 2, 3);
        ctx.fillRect(x + 2, y - 14 + bounce, 2, 3);
      } else if (dir === 'up') {
        // 뒤통수 (얼굴 눈 안 보임)
        if (gender === 'male') {
          ctx.fillStyle = '#1c1917';
          ctx.beginPath();
          ctx.arc(x, y - 14 + bounce, 10, 0, Math.PI * 2);
          ctx.fill();
        }
      } else if (dir === 'left') {
        ctx.fillRect(x - 7, y - 14 + bounce, 2, 3);
      } else if (dir === 'right') {
        ctx.fillRect(x + 5, y - 14 + bounce, 2, 3);
      }

      // 머리 위 네임태그
      ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
      ctx.beginPath();
      ctx.roundRect(x - 30, y - 36 + bounce, 60, 16, 8);
      ctx.fill();

      ctx.fillStyle = '#f8fafc';
      ctx.font = 'bold 10px Pretendard';
      ctx.textAlign = 'center';
      ctx.fillText(userProfile.name, x, y - 24 + bounce);

      ctx.restore();
    }

    // --- 8. 인터랙션 및 토스트 알림 ---
    function showToast(msg) {
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toast-msg');
      toastMsg.textContent = msg;
      toast.style.opacity = '1';
      clearTimeout(toast.timer);
      toast.timer = setTimeout(() => {
        toast.style.opacity = '0';
      }, 2500);
    }

    function spawnParticles(x, y, color, count = 12) {
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const spd = 1 + Math.random() * 2.5;
        particles.push({
          x: x,
          y: y,
          vx: Math.cos(angle) * spd,
          vy: Math.sin(angle) * spd,
          size: 2 + Math.random() * 3,
          color: color,
          alpha: 1,
          decay: 0.02 + Math.random() * 0.03
        });
      }
    }

    // 마우스 / 터치 좌표 변환
    function handlePointer(clientX, clientY) {
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      const targetX = (clientX - rect.left) * scaleX;
      const targetY = (clientY - rect.top) * scaleY;

      // 클릭 이펙트 생성
      player.clickEffect = { x: targetX, y: targetY, radius: 4, alpha: 1 };
      spawnParticles(targetX, targetY, '#f59e0b', 8);

      // 가구 클릭 인터랙션 확인
      const colliders = currentScene === 'indoor' ? indoorColliders : outdoorColliders;
      for (let c of colliders) {
        if (targetX >= c.x && targetX <= c.x + c.w &&
            targetY >= c.y && targetY <= c.y + c.h) {
          
          if (c.type === 'board') {
            openBoardModal();
            return;
          } else if (c.type === 'fountain') {
            spawnParticles(c.x + 60, c.y + 60, '#38bdf8', 25);
            showToast('🪙 분수대에 행운의 소원 동전을 던졌습니다!');
            return;
          } else if (c.type === 'bench') {
            showToast('🌿 벤치 그늘에 앉아 시원한 바람을 느낍니다.');
            return;
          } else if (c.type === 'flowers') {
            spawnParticles(c.x + 85, c.y + 55, '#f43f5e', 20);
            showToast('🌸 향기로운 꽃밭에서 맑은 꽃향기를 맡았습니다.');
            return;
          } else if (c.type === 'coffee') {
            spawnParticles(c.x + 100, c.y + 35, '#d97706', 15);
            showToast('☕ 신선한 원두를 갈아 따뜻한 드립 커피를 내렸습니다.');
            return;
          } else if (c.type === 'music') {
            toggleBgm();
            return;
          }
        }
      }

      // 목표 이동 지점 지정
      player.targetX = targetX;
      player.targetY = targetY;
    }

    canvas.addEventListener('mousedown', e => handlePointer(e.clientX, e.clientY));
    canvas.addEventListener('touchstart', e => {
      e.preventDefault();
      if (e.touches.length > 0) {
        handlePointer(e.touches[0].clientX, e.touches[0].clientY);
      }
    }, { passive: false });

    // 버튼 바인딩
    document.getElementById('music-btn').addEventListener('click', toggleBgm);
    document.getElementById('scene-toggle-btn').addEventListener('click', () => {
      switchScene(currentScene === 'indoor' ? 'outdoor' : 'indoor');
    });

    // --- 9. 온보딩 / 프로필 설정 모달 로직 ---
    const profileModal = document.getElementById('profile-modal');
    const inputName = document.getElementById('input-name');
    const saveProfileBtn = document.getElementById('save-profile-btn');
    const cancelProfileBtn = document.getElementById('cancel-profile-btn');
    const profileEditBtn = document.getElementById('profile-edit-btn');
    const btnMale = document.getElementById('gender-male');
    const btnFemale = document.getElementById('gender-female');
    let selectedGender = 'male';

    function setGenderSelect(g) {
      selectedGender = g;
      if (g === 'male') {
        btnMale.classList.add('border-amber-500', 'bg-amber-500/20');
        btnFemale.classList.remove('border-amber-500', 'bg-amber-500/20');
      } else {
        btnFemale.classList.add('border-amber-500', 'bg-amber-500/20');
        btnMale.classList.remove('border-amber-500', 'bg-amber-500/20');
      }
      document.getElementById('preview-avatar-icon').textContent = g === 'male' ? '👦' : '👧';
    }

    btnMale.addEventListener('click', () => setGenderSelect('male'));
    btnFemale.addEventListener('click', () => setGenderSelect('female'));

    profileEditBtn.addEventListener('click', () => {
      inputName.value = userProfile.name;
      setGenderSelect(userProfile.gender);
      cancelProfileBtn.classList.remove('hidden');
      profileModal.classList.remove('hidden');
    });

    cancelProfileBtn.addEventListener('click', () => {
      profileModal.classList.add('hidden');
    });

    saveProfileBtn.addEventListener('click', () => {
      const val = inputName.value.trim();
      if (!val) {
        alert('이름을 한 글자 이상 입력해주세요!');
        return;
      }
      userProfile.name = val;
      userProfile.gender = selectedGender;
      userProfile.isNew = false;
      saveProfile();
      profileModal.classList.add('hidden');
      showToast(`환영합니다, ${userProfile.name}님! 즐거운 시간 보내세요.`);
    });

    // --- 10. 공지 게시판 (역순 5개 패치노트) ---
    const boardModal = document.getElementById('board-modal');
    const closeBoardBtn = document.getElementById('close-board-btn');
    const tabUpdates = document.getElementById('tab-updates');
    const tabEvents = document.getElementById('tab-events');
    const tabNews = document.getElementById('tab-news');
    const tabContent = document.getElementById('tab-content');

    const patchNotes = [
      { ver: 'v1.6 (최신)', date: '2026-11-03', title: '캐릭터 커스텀 & 로컬 저장 지원', desc: '접속 시 닉네임과 남/여 아바타를 선택할 수 있으며, 새로고침해도 프로필이 보존됩니다.' },
      { ver: 'v1.5', date: '2026-11-03', title: '야외 마을 광장 맵 & 출입문 오픈', desc: '실내에서 문을 밟고 광장으로 나갈 수 있으며, 분수대와 정원 화단이 추가되었습니다.' },
      { ver: 'v1.4', date: '2026-11-03', title: '마을 공지 게시판 설치', desc: '광장 소식 및 탭별 업데이트 내역 확인 시스템이 구현되었습니다.' },
      { ver: 'v1.3', date: '2026-11-03', title: '실시간 이동 물리 & 충돌 판정 개선', desc: '아바타가 가구에 끼이지 않고 클릭한 곳으로 부드럽게 미끄러지듯 이동합니다.' },
      { ver: 'v1.2', date: '2026-11-03', title: '가구 인터랙션 & 칠 신스 BGM 추가', desc: '작업 모니터, 드립 커피 연기 파티클, 턴테이블 Web Audio 로파이 신스가 탑재되었습니다.' }
    ];

    function renderBoardUpdates() {
      tabContent.innerHTML = patchNotes.map(item => `
        <div class="p-3.5 rounded-xl bg-stone-800 border border-stone-700/80">
          <div class="flex items-center justify-between mb-1">
            <span class="px-2 py-0.5 rounded text-[11px] font-bold bg-amber-500/20 text-amber-300 border border-amber-500/30">${item.ver}</span>
            <span class="text-[11px] text-stone-500">${item.date}</span>
          </div>
          <h4 class="font-bold text-stone-100 text-sm mt-1">${item.title}</h4>
          <p class="text-xs text-stone-400 mt-1 leading-relaxed">${item.desc}</p>
        </div>
      `).join('');
    }

    function openBoardModal() {
      renderBoardUpdates();
      boardModal.classList.remove('hidden');
    }

    closeBoardBtn.addEventListener('click', () => boardModal.classList.add('hidden'));

    tabUpdates.addEventListener('click', () => {
      tabUpdates.className = 'px-3 py-1.5 rounded-lg text-xs font-bold bg-amber-600 text-white transition';
      tabEvents.className = 'px-3 py-1.5 rounded-lg text-xs font-medium bg-stone-800 text-stone-400 hover:text-stone-200 transition';
      tabNews.className = 'px-3 py-1.5 rounded-lg text-xs font-medium bg-stone-800 text-stone-400 hover:text-stone-200 transition';
      renderBoardUpdates();
    });

    tabEvents.addEventListener('click', () => {
      tabEvents.className = 'px-3 py-1.5 rounded-lg text-xs font-bold bg-amber-600 text-white transition';
      tabUpdates.className = 'px-3 py-1.5 rounded-lg text-xs font-medium bg-stone-800 text-stone-400 hover:text-stone-200 transition';
      tabNews.className = 'px-3 py-1.5 rounded-lg text-xs font-medium bg-stone-800 text-stone-400 hover:text-stone-200 transition';
      tabContent.innerHTML = `
        <div class="p-6 text-center text-stone-400">
          <span class="text-3xl block mb-2">🎁</span>
          <p class="text-sm font-semibold text-stone-300">진행 중인 이벤트가 없습니다.</p>
          <p class="text-xs text-stone-500 mt-1">새로운 축제 소식이 등록되면 알려드릴게요!</p>
        </div>
      `;
    });

    tabNews.addEventListener('click', () => {
      tabNews.className = 'px-3 py-1.5 rounded-lg text-xs font-bold bg-amber-600 text-white transition';
      tabUpdates.className = 'px-3 py-1.5 rounded-lg text-xs font-medium bg-stone-800 text-stone-400 hover:text-stone-200 transition';
      tabEvents.className = 'px-3 py-1.5 rounded-lg text-xs font-medium bg-stone-800 text-stone-400 hover:text-stone-200 transition';
      tabContent.innerHTML = `
        <div class="p-6 text-center text-stone-400">
          <span class="text-3xl block mb-2">📰</span>
          <p class="text-sm font-semibold text-stone-300">오늘의 마을 뉴스</p>
          <p class="text-xs text-stone-500 mt-1">오늘 날씨는 맑음! 광장 분수대에서 동전을 던져보세요.</p>
        </div>
      `;
    });

    // --- 초기 실행 ---
    loadProfile();
    updateUIHeader();

    if (userProfile.isNew) {
      setGenderSelect('male');
      profileModal.classList.remove('hidden');
    }

    requestAnimationFrame(() => {
      update();
      draw();
    });
  </script>
</body>
</html>
